# docker-compose.yml
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: virtual_reality_postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: virtual-reality-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/virtual-reality-db

volumes:
  postgres_data:
